# Push to main → (1) Supabase: database changes + server functions, (2) the website on GitHub Pages.
# Supabase can't host websites, so the site itself lives on GitHub Pages (free, same repo).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Supabase is set up
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets not set yet (see README → Setup): skipping." ; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.go == 'yes'
        with:
          version: latest
      - name: Database changes
        if: steps.ready.outputs.go == 'yes'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Server functions
        if: steps.ready.outputs.go == 'yes'
        run: supabase functions deploy --project-ref "$PROJECT_REF"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the Supabase address is set
        env:
          URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are empty: the site will say it isn't linked to Supabase. Add them in Settings → Secrets and variables → Actions (Variables or Secrets tab, repository level)."
          fi
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
