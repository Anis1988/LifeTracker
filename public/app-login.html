<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open LifeTracker</title>
<meta name="robots" content="noindex">
<!--
  The bridge for the Android app's sign-in: the email link (or Google) lands here with ?code=…, and the button
  hands that one-time code to the app (lifetracker://auth). The code is useless anywhere else: only the app that
  asked for it can finish the sign-in. Nothing is stored or sent from this page.
-->
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:16px/1.5 Manrope,system-ui,sans-serif;background:#eaeff6;color:#0f172a;overflow:hidden}
  .glow{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:-1}
  .g1{width:420px;height:340px;left:-120px;top:-120px;background:#5eead4}.g2{width:380px;height:300px;right:-140px;bottom:-100px;background:#c4b5fd}
  .card{margin:16px;max-width:380px;width:100%;box-sizing:border-box;padding:28px 22px;border-radius:28px;background:rgba(255,255,255,.75);border:1px solid rgba(15,23,42,.08);box-shadow:0 10px 30px rgba(15,23,42,.1);backdrop-filter:blur(18px);text-align:center}
  h1{margin:.4em 0 .2em;font:600 22px Sora,Manrope,system-ui,sans-serif}
  p{margin:.4em 0;color:#475569;font-size:15px}
  a.btn{display:block;margin-top:18px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#5eead4,#a78bfa);color:#04121a;font-weight:800;text-decoration:none;box-shadow:0 10px 26px -12px #5eead4;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}a.btn:active{transform:scale(.95);transition-duration:.12s}
  .err{color:#b91c1c}
  @media (prefers-color-scheme:dark){body{background:#060912;color:#e8eef5}.g1{background:#0d9488;opacity:.45}.g2{background:#6d28d9;opacity:.4}.card{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}p{color:#94a3b8}.err{color:#fca5a5}}
</style>
</head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<main class="card">
  <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1430"/><stop offset="1" stop-color="#0a2a33"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5eead4" stop-opacity=".45"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient><radialGradient id="c" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#ecfeff"/><stop offset=".45" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></radialGradient><linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#a)"/><circle cx="32" cy="32" r="22" fill="url(#g)"/><g transform="rotate(-24 32 32)" fill="none" stroke="url(#r)" stroke-width="2.8" stroke-linecap="round"><path d="M9 32A23 9 0 0 1 55 32" stroke-opacity=".55"/><circle cx="32" cy="32" r="10.5" fill="url(#c)" stroke="none"/><path d="M55 32A23 9 0 0 1 9 32"/><circle cx="51.9" cy="27.5" r="3.4" fill="#fbbf24" stroke="none"/></g><rect width="64" height="64" rx="15" fill="url(#s)"/><rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".14"/></svg>
  <h1 id="t">Open LifeTracker</h1>
  <p id="m">Tap the button to finish signing in, in the app.</p>
  <a class="btn" id="b" href="#">Open in the LifeTracker app</a>
  <p id="w" style="font-size:13px;margin-top:14px">On a computer? <a href="./">Open the website</a> instead.</p>
</main>
<script>
  (function () {
    var q = location.search.slice(1), h = location.hash.slice(1);
    var params = new URLSearchParams(q || h);
    var err = params.get('error_description') || params.get('error');
    if (err) {
      document.getElementById('t').textContent = 'Sign-in didn’t work';
      var m = document.getElementById('m'); m.textContent = err.replace(/\+/g, ' ') + '. Go back to the app and try again.'; m.className = 'err';
    }
    var tail = 'auth' + (q ? '?' + q : '') + (h ? '#' + h : '');
    var android = /android/i.test(navigator.userAgent);
    // Android opens the app from an "intent:" link; elsewhere the plain lifetracker:// link.
    var href = android ? 'intent://' + tail + '#Intent;scheme=lifetracker;package=app.lifetracker;end' : 'lifetracker://' + tail;
    var b = document.getElementById('b');
    b.href = href;
    if (err) b.textContent = 'Back to the app';
    if (!params.get('code') && !err) b.style.display = 'none', (document.getElementById('m').textContent = 'Nothing to open here.');
  })();
</script>
</body></html>
